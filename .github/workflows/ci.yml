name: CI

on:
    push:
        branches: ['main']
    pull_request:
    workflow_dispatch:

jobs:
    fixture-guard:
        name: 픽스처 불변 확인
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 픽스처 변경 여부 확인
              env:
                  BASE_REF: ${{ github.base_ref }}
                  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
              run: |
                  changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- fixtures/sundaes/)

                  if [ -z "$changed" ]; then
                      echo "픽스처 변경 없음"
                      exit 0
                  fi

                  echo "이 PR 이 픽스처를 변경합니다:"
                  echo "$changed" | sed 's/^/  /'
                  echo

                  if echo ",${LABELS}," | grep -q ",fixture-change,"; then
                      echo "fixture-change 라벨이 붙어 있어 의도된 변경으로 보고 통과시킵니다."
                      exit 0
                  fi

                  echo "픽스처는 실험 간 비교 기준입니다. 여기가 바뀌면 이 커밋 이후의 측정값을"
                  echo "이전 실행과 비교할 수 없고, 성능 변화가 에이전트 탓인지 픽스처 탓인지"
                  echo "구분되지 않습니다."
                  echo
                  echo "실험 중이었다면 되돌리지 않은 것입니다:"
                  echo "    cd fixtures/sundaes && git checkout -- src/"
                  echo
                  echo "측정 자체가 불가능해서 고쳐야 하는 경우라면 docs/ 에 근거를 남기고"
                  echo "이 PR 에 fixture-change 라벨을 붙이세요."
                  exit 1

    fixture:
        name: 픽스처 (sundaes)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: fixtures/sundaes
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: fixtures/sundaes/package-lock.json

            - name: 의존성 설치
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: 타입 체크
              run: npx tsc --noEmit

            - name: 테스트 + 커버리지
              run: npm run test:coverage

            - name: 커버리지 아티팩트 업로드
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: fixtures/sundaes/coverage
