name: CI

on:
    push:
        branches: ['main']
    pull_request:
    workflow_dispatch:

jobs:
    fixture:
        name: 픽스처 (sundaes)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: fixtures/sundaes
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: fixtures/sundaes/package-lock.json

            - name: 의존성 설치
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: 타입 체크
              run: npx tsc --noEmit

            - name: 테스트 + 커버리지
              run: npm run test:coverage

            - name: 커버리지 아티팩트 업로드
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: fixtures/sundaes/coverage
